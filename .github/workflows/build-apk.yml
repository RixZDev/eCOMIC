name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm install
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android
      - run: mkdir -p www && echo "<html></html>" > www/index.html
      - run: npx cap add android
      - run: npx cap sync
      - run: chmod +x android/gradlew
      - run: cd android &&./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: apk-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
